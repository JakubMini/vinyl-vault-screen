name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run check

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # custom_sdkconfig makes pioarduino build twice, the second time with the core in its own penv.
      # Its newest core, 6.2.0.post1, fails the platform's ">=6.2.0" check; a penv made here with
      # 6.2.0 is kept as it is.
      - run: python -m venv ~/.platformio/penv && ~/.platformio/penv/bin/pip install "pioarduino==6.2.0"
      - run: pio test -e native
      - run: pio run -e screen
