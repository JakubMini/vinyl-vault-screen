; Waveshare ESP32-S3-Touch-LCD-4B ("86 box"): ESP32-S3 N16R8, 480x480 ST7701 RGB panel, GT911 touch.
; pioarduino brings Arduino core 3 (ESP-IDF 5), whose RGB panel driver has bounce buffers, which
; keep the picture steady while Wi-Fi and PSRAM are busy.

[env:screen]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
; -O2: the wheel's pixel loops run about twice as fast as with the default -Os.
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/include
  -DCORE_DEBUG_LEVEL=2
  ; Serial over the chip's own USB port: the board has no USB-serial chip.
  -DARDUINO_USB_CDC_ON_BOOT=1
; The panel is fed from a PSRAM framebuffer through bounce buffers, refilled by an interrupt on core 0.
; Espressif's settings for that (pioarduino's "OPI Performance settings -> Display use" example):
; - code and constants run from PSRAM (XIP), so a flash write no longer takes PSRAM away from the panel;
; - the LCD and GDMA interrupts stay in IRAM and keep running during flash writes;
; - 64-byte cache lines, which bounce-buffer mode needs or the picture drifts.
; Not their 64 KB data cache: it comes out of internal RAM, which TLS needs.
; RESTART_IN_VSYNC off: on, IDF 5.5 never resets the refill counter, so one late refill leaves the
; picture shifted until another late one; off, it notices the short frame and resets in VSYNC.
; Any change here rebuilds the Arduino core's IDF libraries (about 4 min, then cached).
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
  CONFIG_GDMA_ISR_IRAM_SAFE=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
lib_deps =
  lvgl/lvgl@9.6.0
  moononournation/GFX Library for Arduino@1.6.9
  bitbank2/JPEGDEC
  bitbank2/bb_captouch
  bblanchon/ArduinoJson@^7.3.2
  adafruit/Adafruit PN532@^1.3.4

; The wheel maths, tested on the laptop: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
